name: Python Q04

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Check
        run: python -m py_compile src/main.py

      - name: Tests
        run: pytest -v
  
  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Build Docker
        run: docker build -t DIM0517_2026_Prova_U2 .

      - name: Rodar a Imagem
        run: docker run -d --name prova -p 8080:8080 DIM0517_2026_Prova_U2